// ══════════════════════════════════════════════
//  ✏ 펜/필기 기능
// ══════════════════════════════════════════════
var penState = {
  active:false, isEraser:false, isStickerMode:false,
  color:'#e8c97a', size:3, drawing:false,
  lastX:0, lastY:0, hasMoved:false,
};
var stickerList  = [];
var undoStack    = [];
var redoStack    = [];
var MAX_UNDO     = 30;

function annotKey(){
  var song = S.viewerSongs[S.viewerIdx];
  if(!song) return null;
  // ★ 5) 곡별 완전 분리: file_name(고유) + 곡 순서 + 페이지
  //   file_name이 없으면 song_title 사용
  var base = (song.file_name || song.song_title || 'unknown').replace(/[^a-zA-Z0-9가-힣._-]/g, '_');
  return 'annot_' + base + '_idx' + S.viewerIdx + '_p' + S.pdfPage;
}

function togglePenMode(){
  penState.active = !penState.active;
  var aCanvas = document.getElementById('annotation-canvas');
  var toolbar = document.getElementById('pen-toolbar');
  var penBtn  = document.getElementById('pen-toggle-btn');

  if(penState.active){
    // 펜 ON
    aCanvas.classList.add('pen-active');
    toolbar.classList.add('show');
    penBtn.classList.add('active');
    // canvas 크기 동기화 (새로 열 때만)
    syncAnnotationCanvasSize();
    void aCanvas.offsetHeight;
    loadAnnotation();
  } else {
    // 펜 OFF
    aCanvas.classList.remove('pen-active');
    toolbar.classList.remove('show');
    penBtn.classList.remove('active');
    penState.isEraser = false;
    penState.isStickerMode = false;
    penState.drawing = false;
    document.getElementById('eraser-btn').classList.remove('active');
    var sBtn = document.getElementById('sticker-btn');
    if(sBtn) sBtn.classList.remove('active');

    // ★ 1) OFF 시 canvas 크기 재설정 금지 — width 재할당하면 내용이 지워짐
    //   pointer-events만 none으로 변경해 필기 내용 보존
    aCanvas.style.pointerEvents = 'none';
    aCanvas.style.cursor = 'default';
  }
}

// skipLoad=true 일 때 크기 변경 후 loadAnnotation 자동 호출 억제
// (applyZoom 흐름에서 호출자가 직접 loadAnnotation을 제어할 때 사용)
function syncAnnotationCanvasSize(skipLoad){
  var aCanvas = document.getElementById('annotation-canvas');
  var pEvents = penState.active ? 'all' : 'none';

  // ★ 3) zoom 보정된 논리 픽셀 크기
  var sz    = getWrapLogicalSize();
  var newW  = sz.w;
  var newH  = sz.h;

  // ★ 1) canvas width/height 재할당은 내용을 지우므로
  //   크기가 실제로 달라질 때만 재할당
  if(aCanvas.width !== newW || aCanvas.height !== newH){
    aCanvas.width  = newW;
    aCanvas.height = newH;
    // 크기가 바뀐 경우 필기 복원 — skipLoad=true이면 호출자가 직접 처리
    if(!skipLoad) loadAnnotation();
  }

  // 스타일은 항상 갱신 (pointer-events 등)
  // ★ 펜 활성 시 touch-action:none — Safari가 제스처 인터셉트 안 하도록
  var tAction = penState.active ? 'none' : 'pan-x';
  aCanvas.style.cssText = [
    'position:absolute',
    'inset:0',
    'width:100%',
    'height:100%',
    'touch-action:' + tAction,
    '-webkit-touch-callout:none',
    '-webkit-user-select:none',
    'user-select:none',
    'cursor:crosshair',
    'pointer-events:' + pEvents,
    'z-index:20'
  ].join(';');
}

function setPenColor(el){
  document.querySelectorAll('.pen-color-dot').forEach(function(d){d.classList.remove('selected');});
  el.classList.add('selected');
  penState.color=el.dataset.color; penState.isEraser=false;
  document.getElementById('eraser-btn').classList.remove('active');
}
function setPenSize(v){ penState.size=parseInt(v); document.getElementById('pen-size-label').textContent=v; }
function toggleEraser(){ penState.isEraser=!penState.isEraser; document.getElementById('eraser-btn').classList.toggle('active',penState.isEraser); }

function clearAnnotation(){
  var aCanvas=document.getElementById('annotation-canvas');
  var ctx=aCanvas.getContext('2d');
  pushUndoSnapshot();
  ctx.clearRect(0,0,aCanvas.width,aCanvas.height);
  var key=annotKey();
  if(key){ try{localStorage.removeItem(key);}catch(e){} }
  updateUndoUI();
}

function pushUndoSnapshot(){
  var aCanvas=document.getElementById('annotation-canvas');
  if(!aCanvas||aCanvas.width===0) return;
  try{
    var snap=aCanvas.toDataURL('image/png');
    undoStack.push(snap);
    if(undoStack.length>MAX_UNDO) undoStack.shift();
    redoStack=[];
    updateUndoUI();
  }catch(e){}
}
function undoAnnotation(){
  if(undoStack.length===0){toast('더 이상 되돌릴 수 없습니다.');return;}
  var aCanvas=document.getElementById('annotation-canvas');
  var ctx=aCanvas.getContext('2d');
  try{redoStack.push(aCanvas.toDataURL('image/png'));}catch(e){}
  var snap=undoStack.pop();
  ctx.clearRect(0,0,aCanvas.width,aCanvas.height);
  var img=new Image(); img.onload=function(){ctx.drawImage(img,0,0);}; img.src=snap;
  updateUndoUI(); saveAnnotation();
}
function redoAnnotation(){
  if(redoStack.length===0){toast('다시 실행할 내용이 없습니다.');return;}
  var aCanvas=document.getElementById('annotation-canvas');
  var ctx=aCanvas.getContext('2d');
  try{undoStack.push(aCanvas.toDataURL('image/png'));}catch(e){}
  var snap=redoStack.pop();
  ctx.clearRect(0,0,aCanvas.width,aCanvas.height);
  var img=new Image(); img.onload=function(){ctx.drawImage(img,0,0);}; img.src=snap;
  updateUndoUI(); saveAnnotation();
}
function resetUndoStack(){ undoStack=[]; redoStack=[]; updateUndoUI(); }
function updateUndoUI(){
  var u=document.getElementById('undo-btn'), r=document.getElementById('redo-btn');
  if(u) u.style.opacity=undoStack.length>0?'1':'0.35';
  if(r) r.style.opacity=redoStack.length>0?'1':'0.35';
}

function saveAnnotation(){
  var aCanvas = document.getElementById('annotation-canvas');
  var key     = annotKey();
  if(!key){ toast('저장할 악보가 없습니다.'); return; }

  var tr = _getScoreTransform();
  if(tr.scoreW0 <= 0 || tr.scoreH0 <= 0){ toast('저장할 악보가 없습니다.'); return; }

  var off = document.createElement('canvas');
  off.width  = Math.round(tr.scoreW0);
  off.height = Math.round(tr.scoreH0);
  var offCtx = off.getContext('2d');
  offCtx.drawImage(aCanvas,
    tr.left_px, tr.top_px,
    tr.scoreW * getZoom(), tr.scoreH * getZoom(),
    0, 0, off.width, off.height
  );

  var payload = {
    dataUrl   : off.toDataURL('image/png'),
    scoreW0   : off.width,
    scoreH0   : off.height,
    normalized: true
  };

  try{
    localStorage.setItem(key, JSON.stringify(payload));
    toast('✓ 필기 저장됨');
  }catch(e){
    cleanOldAnnotations();
    try{
      localStorage.setItem(key, JSON.stringify(payload));
      toast('✓ 필기 저장됨 (오래된 필기 일부 삭제)');
    }catch(e2){ toast('저장 실패 (용량 부족): ' + e2.message); }
  }
}

/** 현재 표시 중인 악보 DOM 요소 반환 */
function _getScoreElement(){
  var canvas = document.getElementById('pdf-canvas');
  if(canvas && canvas.style.display !== 'none') return canvas;
  var img = document.getElementById('img-viewer');
  if(img && img.style.display !== 'none') return img;
  return null;
}
function loadAnnotation(){
  var aCanvas = document.getElementById('annotation-canvas');
  var ctx     = aCanvas.getContext('2d');

  ctx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  resetUndoStack();

  var key = annotKey();
  if(!key) return;

  try{
    var raw = localStorage.getItem(key);
    if(!raw) return;

    var payload;
    if(raw.charAt(0) === '{'){
      payload = JSON.parse(raw);
    } else {
      payload = { dataUrl: raw, scoreW0: aCanvas.width, scoreH0: aCanvas.height, normalized: false };
    }

    var dataUrl = payload.dataUrl;
    if(!dataUrl) return;

    var img = new Image();
    img.onload = function(){
      ctx.clearRect(0, 0, aCanvas.width, aCanvas.height);

      if(payload.normalized){
        // ★ 악보 원본 좌표계 저장본 복원
        // 저장 시 scoreW0 × scoreH0 이미지를 현재 zoom/pan 위치에 맞게 그리기
        var tr = _getScoreTransform();
        var savedW0 = payload.scoreW0 || payload.scoreW || tr.scoreW0;
        var savedH0 = payload.scoreH0 || payload.scoreH || tr.scoreH0;

        // 저장 당시 원본 크기와 현재 원본 크기 비율 (악보 자체 크기가 달라진 경우 대비)
        var scaleX = (tr.scoreW0 > 0) ? tr.scoreW0 / savedW0 : 1;
        var scaleY = (tr.scoreH0 > 0) ? tr.scoreH0 / savedH0 : 1;

        // 현재 zoom/pan에 맞게 transform 적용하여 복원
        ctx.save();
        ctx.translate(tr.left_px, tr.top_px);
        ctx.scale(tr.totalScale * scaleX, tr.totalScale * scaleY);
        ctx.drawImage(img, 0, 0, savedW0, savedH0);
        ctx.restore();
      } else {
        // 구버전 호환
        var tr2 = _getScoreTransform();
        ctx.save();
        ctx.translate(tr2.left_px, tr2.top_px);
        ctx.scale(tr2.totalScale, tr2.totalScale);
        ctx.drawImage(img, 0, 0, tr2.scoreW0, tr2.scoreH0);
        ctx.restore();
      }
    };
    img.src = dataUrl;
  }catch(e){}
}
function cleanOldAnnotations(){
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('annot_'))keys.push(k);}
    if(keys.length>50) keys.slice(0,keys.length-40).forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}
}

function setupAnnotationCanvas(){
  var aCanvas=document.getElementById('annotation-canvas');
  var ptBuf=[];

  // ctx 캐싱
  var ctx = aCanvas.getContext('2d');

  // rAF 드로우 큐
  var pendingEvents = [];
  var rafId = null;
  function flushDraw(){
    rafId = null;
    for(var i=0;i<pendingEvents.length;i++) _processDraw(pendingEvents[i]);
    pendingEvents = [];
  }
  function scheduleDraw(){ if(!rafId) rafId = requestAnimationFrame(flushDraw); }

  /**
   * pointer 이벤트 → 악보 원본 좌표계 변환
   * clientX/Y  →  imgX/Y (zoom=1, pan=0 기준 악보 픽셀)
   *
   * 변환식:
   *   canvasX = (clientX - rect.left)          (CSS px)
   *   imgX    = (canvasX * cssZoom - left_px) / totalScale
   *           = (canvasX * cssZoom - left_px) / (pdfZoom * cssZoom)
   */
  function getPos(e){
    var rect = aCanvas.getBoundingClientRect();
    var cssZoom = getZoom();
    var tr = _getScoreTransform();

    // canvas CSS 좌표 (getBoundingClientRect 기준)
    var canvasX = e.clientX - rect.left;
    var canvasY = e.clientY - rect.top;

    // canvas 물리 픽셀 좌표
    var physX = canvasX * cssZoom;
    var physY = canvasY * cssZoom;

    // 악보 원본 좌표계로 변환
    var imgX = (physX - tr.left_px) / tr.totalScale;
    var imgY = (physY - tr.top_px)  / tr.totalScale;

    return { x: imgX, y: imgY, p: (e.pressure > 0 && e.pressure <= 1) ? e.pressure : 0.5 };
  }

  function pressureToWidth(pressure, baseSize){
    var p = Math.pow(Math.max(0.05, pressure), 0.4);
    return Math.max(0.8, baseSize * p * 2.2);
  }

  /**
   * ctx에 "악보 원본 좌표계" transform 적용
   * 원본 좌표로 그리면 자동으로 현재 zoom/pan 위치에 렌더링됨
   */
  function applyScoreTransform(){
    var tr = _getScoreTransform();
    ctx.setTransform(tr.totalScale, 0, 0, tr.totalScale, tr.left_px, tr.top_px);
  }
  function resetTransform(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawCatmullRom(p0, p1, p2, p3, lineW){
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y);
    for(var i=1; i<=12; i++){
      var s=i/12, s2=s*s, s3=s2*s;
      var x=0.5*((2*p1.x)+(-p0.x+p2.x)*s+(2*p0.x-5*p1.x+4*p2.x-p3.x)*s2+(-p0.x+3*p1.x-3*p2.x+p3.x)*s3);
      var y=0.5*((2*p1.y)+(-p0.y+p2.y)*s+(2*p0.y-5*p1.y+4*p2.y-p3.y)*s2+(-p0.y+3*p1.y-3*p2.y+p3.y)*s3);
      ctx.lineTo(x, y);
    }
    ctx.lineWidth = lineW; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  }

  function startDraw(e){
    if(!penState.active) return;
    if(e.pointerType === 'touch') return;  // 손가락은 pan/swipe 전용

    e.preventDefault(); e.stopPropagation();
    aCanvas.setPointerCapture(e.pointerId);
    penState.drawing=true; penState.hasMoved=false; ptBuf=[];

    var pos = getPos(e);
    penState.lastX=pos.x; penState.lastY=pos.y;
    ptBuf=[pos,pos,pos,pos];

    if(!penState.isStickerMode && !penState.isEraser){
      applyScoreTransform();
      var r0 = Math.max(0.8, penState.size * 0.6);
      ctx.beginPath(); ctx.arc(pos.x, pos.y, r0, 0, Math.PI*2);
      ctx.globalCompositeOperation='source-over'; ctx.fillStyle=penState.color; ctx.fill();
      resetTransform();
    }
  }

  function _processDraw(e){
    if(!penState.active || !penState.drawing) return;
    if(e.pointerType === 'touch') return;
    if(penState.isStickerMode) return;
    penState.hasMoved=true;

    var pos = getPos(e); ptBuf.push(pos);
    while(ptBuf.length < 4) ptBuf.unshift(ptBuf[0]);
    if(ptBuf.length > 4) ptBuf.shift();

    var p0=ptBuf[0], p1=ptBuf[1], p2=ptBuf[2], p3=ptBuf[3];
    var dx=p2.x-p1.x, dy=p2.y-p1.y, speed=Math.sqrt(dx*dx+dy*dy);
    var speedFactor = Math.max(0.4, 1.0 - Math.min(speed,60)/120);
    var avgPressure = (p1.p+p2.p)/2;

    applyScoreTransform();
    if(penState.isEraser){
      ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)';
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
      ctx.lineWidth=penState.size*4; ctx.lineCap='round'; ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    } else {
      ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=penState.color;
      drawCatmullRom(p0,p1,p2,p3, pressureToWidth(avgPressure*speedFactor, penState.size));
    }
    resetTransform();
    penState.lastX=pos.x; penState.lastY=pos.y;
  }

  function draw(e){
    if(e.pointerType === 'touch') return;
    var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(var i=0; i<evts.length; i++) pendingEvents.push(evts[i]);
    scheduleDraw();
  }

  function endDraw(e){
    if(!penState.drawing) return;
    if(e.pointerType === 'touch') return;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; flushDraw(); }
    penState.drawing=false; ptBuf=[];

    if(!penState.hasMoved && !penState.isStickerMode){
      var pos2 = getPos(e);
      var r = penState.isEraser ? penState.size*2.5 : Math.max(1, penState.size*0.7);
      applyScoreTransform();
      ctx.beginPath(); ctx.arc(pos2.x, pos2.y, r, 0, Math.PI*2);
      if(penState.isEraser){ ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,1)'; }
      else{ ctx.globalCompositeOperation='source-over'; ctx.fillStyle=penState.color; }
      ctx.fill(); ctx.globalCompositeOperation='source-over';
      resetTransform();
    }
    if(penState.active){ pushUndoSnapshot(); saveAnnotation(); }
  }

  // ★ pointermove: {passive:false} + touch-action:none (pen 활성 시 syncAnnotationCanvasSize에서 적용)
  aCanvas.addEventListener('pointerdown',   startDraw, {passive:false});
  aCanvas.addEventListener('pointermove',   draw,      {passive:false});
  aCanvas.addEventListener('pointerup',     endDraw,   {passive:false});
  aCanvas.addEventListener('pointerleave',  endDraw,   {passive:false});
  aCanvas.addEventListener('pointercancel', endDraw,   {passive:false});
  aCanvas.addEventListener('contextmenu',   function(e){e.preventDefault();}, {passive:false});
  aCanvas.addEventListener('selectstart',   function(e){e.preventDefault();}, {passive:false});

  // ★ 1) wrap 레벨에서 Apple Pencil(pointerType='pen') 이벤트 전파/기본동작 차단
  //    → Pencil 입력 시 wrap이 scroll/pan하지 않도록 고정
  var wrap = document.getElementById('viewer-canvas-wrap');
  wrap.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'pen'){ e.preventDefault(); }
  }, {passive:false});
  wrap.addEventListener('pointermove', function(e){
    if(e.pointerType === 'pen'){ e.preventDefault(); }
  }, {passive:false});

  // ctx 참조를 canvas 크기 변경 후에도 갱신
  var resizeObs=new ResizeObserver(function(){
    syncAnnotationCanvasSize();
    ctx = aCanvas.getContext('2d');  // ★ 크기 변경 후 ctx 재취득
  });
  resizeObs.observe(document.getElementById('viewer-canvas-wrap'));
}

// ══════════════════════════════════════════════
//  스티커
// ══════════════════════════════════════════════
function toggleStickerMode(){
  penState.isStickerMode=!penState.isStickerMode;
  var sBtn=document.getElementById('sticker-btn');
  var toolbar=document.getElementById('sticker-toolbar');
  if(sBtn) sBtn.classList.toggle('active',penState.isStickerMode);
  if(toolbar) toolbar.style.display=penState.isStickerMode?'flex':'none';
  if(penState.isStickerMode){ toast('스티커 모드: 화면을 터치하면 즉시 생성됩니다'); setupStickerTouch(); }
  else teardownStickerTouch();
}

var _stickerOverlay=null;
function setupStickerTouch(){
  teardownStickerTouch();
  var wrap=document.getElementById('viewer-canvas-wrap');
  var overlay=document.createElement('div');
  overlay.id='sticker-overlay';
  overlay.style.cssText=['position:absolute','inset:0','z-index:25','cursor:crosshair','touch-action:none','-webkit-user-select:none','user-select:none'].join(';');
  _stickerOverlay=overlay;
  var sx=0,sy=0,_placed=false;
  overlay.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;_placed=false;e.preventDefault();e.stopPropagation();},{passive:false});
  overlay.addEventListener('pointerup',function(e){
    e.preventDefault();e.stopPropagation();
    if(_placed)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.sqrt(dx*dx+dy*dy)>12)return;
    _placed=true;
    var rect=wrap.getBoundingClientRect();
    placeSticker(e.clientX-rect.left,e.clientY-rect.top);
  },{passive:false});
  overlay.addEventListener('contextmenu',function(e){e.preventDefault();},{passive:false});
  wrap.appendChild(overlay);
}
function teardownStickerTouch(){
  if(_stickerOverlay){_stickerOverlay.remove();_stickerOverlay=null;}
}

function placeSticker(x,y){
  var wrap=document.getElementById('viewer-canvas-wrap');
  var box=document.createElement('div'); box.className='sticker-box';
  box.style.left=Math.max(0,x-50)+'px'; box.style.top=Math.max(0,y-16)+'px';
  stickerList.push(box);
  var textEl=document.createElement('div'); textEl.className='sticker-text';
  textEl.contentEditable='false'; textEl.style.color='#222'; textEl.style.minWidth='60px';
  var ctrl=document.createElement('div'); ctrl.className='sticker-ctrl'; ctrl.style.display='none';
  var delBtn=document.createElement('button'); delBtn.className='sticker-del-btn'; delBtn.textContent='✕'; delBtn.title='스티커 삭제';
  delBtn.addEventListener('pointerdown',function(e){e.stopPropagation();},{passive:false});
  delBtn.addEventListener('click',function(e){e.stopPropagation();box.remove();var idx=stickerList.indexOf(box);if(idx>=0)stickerList.splice(idx,1);});
  ctrl.appendChild(delBtn); box.appendChild(textEl); box.appendChild(ctrl);

  function enterEdit(e){e.stopPropagation();box.classList.add('editing');textEl.contentEditable='true';ctrl.style.display='none';textEl.focus();var range=document.createRange();range.selectNodeContents(textEl);range.collapse(false);var sel=window.getSelection();if(sel){sel.removeAllRanges();sel.addRange(range);}}
  function exitEdit(){box.classList.remove('editing');textEl.contentEditable='false';window.getSelection()&&window.getSelection().removeAllRanges();}

  var tapTimer=null;
  function onStickerTap(){if(!box.classList.contains('editing')){ctrl.style.display='flex';clearTimeout(tapTimer);tapTimer=setTimeout(function(){ctrl.style.display='none';},3000);}}
  var lastTapTime=0;
  function onStickerDoubleTap(e){var now=Date.now();if(now-lastTapTime<300){enterEdit(e);lastTapTime=0;}else{lastTapTime=now;onStickerTap();}}

  box.addEventListener('click',function(e){if(e.target===delBtn)return;e.stopPropagation();onStickerDoubleTap(e);});
  box.addEventListener('touchend',function(e){if(e.target===delBtn)return;e.stopPropagation();e.preventDefault();onStickerDoubleTap(e);},{passive:false});
  textEl.addEventListener('blur',exitEdit);
  textEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){exitEdit();e.preventDefault();return;}if(e.key==='Escape'){exitEdit();e.preventDefault();return;}e.stopPropagation();});

  var dragging=false,dStartX=0,dStartY=0,origL=0,origT=0;
  box.addEventListener('pointerdown',function(e){if(box.classList.contains('editing'))return;if(e.target===delBtn)return;dragging=true;dStartX=e.clientX;dStartY=e.clientY;origL=parseInt(box.style.left)||0;origT=parseInt(box.style.top)||0;box.setPointerCapture(e.pointerId);e.stopPropagation();e.preventDefault();},{passive:false});
  box.addEventListener('pointermove',function(e){if(!dragging)return;box.style.left=(origL+e.clientX-dStartX)+'px';box.style.top=(origT+e.clientY-dStartY)+'px';e.stopPropagation();},{passive:false});
  box.addEventListener('pointerup',   function(e){dragging=false;},{passive:true});
  box.addEventListener('pointerleave',function(e){dragging=false;},{passive:true});

  wrap.appendChild(box);
  setTimeout(function(){enterEdit({stopPropagation:function(){}});},60);
}

function init(){
  var t=new Date();
  S.viewCalY=t.getFullYear(); S.viewCalM=t.getMonth()+1;
  document.getElementById('worship-date').value=toDateStr(t);
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  setupGestures();
  setupKeyboard();
  setupOrientationHandler();
  setupAnnotationCanvas();
}

// ══════════════════════════════════════════════
//  화면 방향(Orientation) 자동 감지 & 대응
// ══════════════════════════════════════════════
function isLandscape(){ return window.innerWidth>window.innerHeight; }

function onOrientationChange(){
  var viewerActive=document.getElementById('screen-viewer').classList.contains('active');
  if(viewerActive){
    setTimeout(function(){
      var canvas=document.getElementById('pdf-canvas');
      var img=document.getElementById('img-viewer');
      if(canvas.style.display!=='none'){
        if(isFullview) renderFitPdfPage(); else renderPdfPage();
      } else if(img.style.display!=='none'){
        applyImageSquareMode();
      }
    },120);
  }
  var calResult=document.getElementById('view-cal-result');
  if(isLandscape()&&calResult){
    calResult.classList.add('show');
    if(!S.viewCalSel) viewCalSelect(toDateStr(new Date()));
  }
}

function setupOrientationHandler(){
  if(window.screen&&window.screen.orientation)
    window.screen.orientation.addEventListener('change',onOrientationChange);
  var resizeTimer;
  window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(onOrientationChange,100);});
  onOrientationChange();
}

init();
